<!DOCTYPE html><!--
  Main conversation workspace fixture: reproduces Layout's centerCol (consuming
  --dsw-alias-bg-base), Conversation header crumbs + corner slot (triggering the
  wooden header ribbon), the Hero scenery slot, a markdown prose + code island
  bubble, and the Composer speech bubble with Model Selection.
--><html lang="zh-CN" data-dsh-splat-ui-skin="active"><head>
<meta charset="utf-8">
<title>主工作区 · 会话界面</title>
<link rel="stylesheet" href="css/dsh.css">
<link rel="stylesheet" href="css/theme-base.css">
<link rel="stylesheet" href="css/plugins/layout.css">
<link rel="stylesheet" href="css/plugins/conversation.css">
<link rel="stylesheet" href="css/plugins/chat.css">
<link rel="stylesheet" href="css/plugins/model-selection.css">
<link rel="stylesheet" href="css/skin.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  .workspace-frame {
    height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
  }
  .workspace-frame .mP3x-q_centerCol {
    grid-area: 1 / 1;
    height: 100%;
    border-radius: 0 !important;
  }
  .an3WzG_root {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }
  .an3WzG_scrollBody {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 8px 28px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .demo-thread {
    width: min(740px, 100%);
    margin: 0 auto;
    display: grid;
    gap: 10px;
  }
  .demo-user-msg {
    justify-self: end;
    max-width: 80%;
    padding: 10px 16px;
    border-radius: 18px;
    background: var(--dsw-specific-bubble);
    color: var(--dsw-alias-label-primary);
    font-size: 14px;
  }
  .demo-assistant-msg {
    color: var(--dsw-alias-label-primary);
    font-size: 14px;
    line-height: 1.65;
  }
  .demo-assistant-msg p { margin: 0 0 10px; }
  .demo-code-card {
    border-radius: var(--dsl-code-block-radius, 14px);
    background: var(--dsw-alias-markdown-code-block, #101010);
    color: var(--shiki-foreground, #f4f4ec);
    border: 2px solid var(--dsw-alias-border-l4, #121212);
    overflow: hidden;
  }
  .demo-code-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 14px;
    background: var(--dsw-alias-markdown-code-block-banner, #1e1e1d);
    color: var(--shiki-foreground, #f4f4ec);
    font-size: 12px;
    font-weight: 700;
  }
  .demo-code-banner button {
    padding: 2px 10px;
    border-radius: 999px;
    border: 1px solid rgba(244, 244, 236, 0.28);
    background: rgba(255, 255, 255, 0.08);
    color: var(--shiki-foreground, #f4f4ec);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .demo-code-card pre {
    margin: 0;
    padding: 14px 16px;
    overflow-x: auto;
    color: var(--shiki-foreground, #f4f4ec);
    font-family: var(--ds-font-family-code, monospace);
    font-size: 13px;
    line-height: 1.6;
  }
  .an3WzG_composerSeat {
    flex: none;
    padding: 4px 28px 14px;
  }
  .GRgSLq_root {
    width: min(740px, 100%);
    margin: 0 auto;
  }
  .GRgSLq_card {
    padding: 14px 16px 10px;
  }
  .GRgSLq_input {
    min-height: 36px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--dsw-alias-label-primary);
    outline: none;
  }
  .GRgSLq_row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 8px;
  }
  .GRgSLq_tools,
  .GRgSLq_trailing,
  .GRgSLq_standardControls {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .GRgSLq_add {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--dsw-alias-label-secondary);
    cursor: pointer;
  }
  .GRgSLq_primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }
</style>
</head>
