<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#141413" />
    <title>SPLAT-STREET · 竖版宣传片（3:4）</title>
    <link rel="icon" href="../favicon.ico?v=3" sizes="48x48" />
    <link rel="icon" href="../assets/icon-256.png?v=3" type="image/png" sizes="256x256" />
    <link rel="apple-touch-icon" href="../assets/icon-256.png?v=3" />
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("../assets/fonts/nunito-400.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Nunito";
        src: url("../assets/fonts/nunito-700.woff2") format("woff2");
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: "Nunito";
        src: url("../assets/fonts/nunito-900.woff2") format("woff2");
        font-weight: 900;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #141413;
        color: #f8f8ef;
        font: 16px/1.6 "Nunito", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px clamp(16px, 3vw, 32px);
        background: rgba(20, 20, 19, 0.94);
        backdrop-filter: blur(10px);
        border-bottom: 3px solid #1edc00;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #f8f8ef;
        text-decoration: none;
        font-weight: 900;
        font-size: 18px;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 28px;
        height: 28px;
        border-radius: 7px;
      }
      .topbar nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .pill,
      .lang-select {
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 4px 12px;
        border-radius: 999px;
        border: 2px solid #4a4a44;
        background: #141413;
        color: #f8f8ef;
        text-decoration: none;
        font: inherit;
        font-size: 14px;
        font-weight: 800;
      }
      .lang-select {
        cursor: pointer;
      }
      .pill:hover,
      .lang-select:hover {
        border-color: #1edc00;
        color: #1edc00;
      }
      .pill.is-active {
        background: #1edc00;
        border-color: #1edc00;
        color: #121212;
      }
      .pill--pink:hover {
        border-color: #ff2d8a;
        color: #ff2d8a;
      }
      main {
        max-width: 1120px;
        margin: auto;
        padding: 32px clamp(16px, 3vw, 24px) 56px;
      }
      h1 {
        font-size: clamp(30px, 4vw, 44px);
        font-weight: 900;
        letter-spacing: -0.02em;
        margin: 0;
      }
      h2 {
        font-size: 22px;
        font-weight: 900;
        margin: 36px 0 12px;
        color: #1edc00;
      }
      p {
        color: #c9c9c0;
      }
      video {
        display: block;
        max-width: 100%;
        width: 486px;
        margin: 28px auto;
        background: #0d0e0d;
        border: 4px solid #1edc00;
        border-radius: 16px;
        box-shadow: 8px 8px 0 #ff2d8a;
      }
      .meta-nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 18px 0;
      }
      .meta-nav a {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 6px 14px;
        border: 2px solid #4a4a44;
        border-radius: 8px;
        color: #1edc00;
        text-decoration: none;
        font-weight: 800;
        font-size: 14px;
      }
      .meta-nav a:hover {
        border-color: #1edc00;
        background: #1d1d1b;
      }
      .spec {
        text-align: center;
        font-size: 14px;
        color: #b6b6ab;
      }
      .note {
        display: block;
        text-align: center;
        color: #9e9e93;
        margin-top: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        margin-top: 20px;
      }
      .shot {
        padding: 0;
        border: 2px solid #4a4a44;
        background: #232321;
        color: #f8f8ef;
        text-align: left;
        cursor: pointer;
        border-radius: 12px;
        overflow: hidden;
        font: inherit;
        transition:
          transform 0.14s ease,
          border-color 0.14s ease;
      }
      .shot:hover,
      .shot:focus-visible {
        border-color: #1edc00;
        transform: translateY(-2px);
        outline: 3px solid #1edc00;
        outline-offset: 2px;
      }
      .shot.is-active {
        border-color: #ff2d8a;
        box-shadow: 4px 4px 0 #ff2d8a;
      }
      .shot img {
        display: block;
        width: 100%;
        aspect-ratio: 3/4;
      }
      .shot span {
        display: block;
        padding: 12px;
        font-size: 14px;
        font-weight: 700;
      }
      @media (max-width: 680px) {
        .topbar {
          position: static;
        }
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 440px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-i18n-page="promoVertical">
    <header class="topbar">
      <a class="brand" href="../"><img src="../assets/icon-256.png" alt="" /><span>SPLAT-STREET</span></a>
      <nav aria-label="页面导航" data-i18n-attr="aria-label:promoVertical.navAria">
        <a class="pill" href="../" data-i18n="promoVertical.navHome">官网首页</a>
        <a class="pill is-active" href="./" aria-current="page" data-i18n="promoVertical.navVertical">竖版 3:4</a>
        <a class="pill" href="animatic-landscape.html" data-i18n="promoVertical.navLandscape">横版 16:9</a>
        <a class="pill pill--pink" href="../showcase/" data-i18n="promoVertical.navShowcase">组件图鉴</a>
        <a class="pill" href="https://github.com/Shirolin/dsh-theme-splat-ui" target="_blank" rel="noreferrer">GitHub</a>
        <select class="lang-select" data-lang-select aria-label="选择语言">
          <option value="zh">简体中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </nav>
    </header>
    <main>
      <h1 data-i18n="promoVertical.heading">把工作台，涂成主场。</h1>
      <p data-i18n="promoVertical.lead">SPLAT-STREET 竖版宣传片（3:4 · 适用手机端与社群分享），含斯普拉遁 2 风格配乐与完整九镜实机画面。</p>
      <video id="film" controls playsinline preload="metadata" poster="poster-vertical.webp" src="splat-street-vertical.mp4" aria-label="SPLAT-STREET 墨街主题 30 秒竖版宣传片" data-i18n-attr="aria-label:promoVertical.videoAria"></video>
      <div class="meta-nav">
        <a href="splat-street-vertical.mp4" data-i18n="promoVertical.linkMp4">成片 MP4</a>
        <a href="cover-vertical.png" data-i18n="promoVertical.linkCover">高清封面 PNG</a>
        <a href="poster-vertical.webp" data-i18n="promoVertical.linkPoster">WebP 海报</a>
        <a href="source/README.md" data-i18n="promoVertical.linkReadme">复现说明</a>
        <a href="verification.json" data-i18n="promoVertical.linkJson">规格验证 JSON</a>
      </div>
      <p class="spec" data-i18n="promoVertical.spec">1080×1440 · 30 秒 · 30fps · H.264 CRF18 · bt709 · AAC 48kHz 立体声</p>
      <small class="note" data-i18n="promoVertical.note">画面来自隔离 DSH 宿主实机渲染演示；点击下方任意分镜可直接跳转对应时间轴。</small>
      <h2 data-i18n="promoVertical.storyboardHeading">九镜分镜索引</h2>
      <div class="grid">
        <button class="shot" data-time="1.1"><img src="storyboard/shot-01.png" alt="墨街开涂！" data-i18n-attr="alt:promoVertical.shots.0.alt" /><span data-i18n-html="promoVertical.shots.0.captionHtml">01 · 0–2.4s<br />墨街开涂！</span></button>
        <button class="shot" data-time="3.1"><img src="storyboard/shot-02.png" alt="三色街区，开局即满涂。" data-i18n-attr="alt:promoVertical.shots.1.alt" /><span data-i18n-html="promoVertical.shots.1.captionHtml">02 · 2.4–5.95s<br />三色街区，开局即满涂。</span></button>
        <button class="shot" data-time="6.6"><img src="storyboard/shot-03.png" alt="指令上膛，连发不卡壳。" data-i18n-attr="alt:promoVertical.shots.2.alt" /><span data-i18n-html="promoVertical.shots.2.captionHtml">03 · 5.95–9.18s<br />指令上膛，连发不卡壳。</span></button>
        <button class="shot" data-time="9.8"><img src="storyboard/shot-04.png" alt="满涂还是护眼？墨度随手调。" data-i18n-attr="alt:promoVertical.shots.3.alt" /><span data-i18n-html="promoVertical.shots.3.captionHtml">04 · 9.18–12.9s<br />满涂还是护眼？墨度随手调。</span></button>
        <button class="shot" data-time="13.1"><img src="storyboard/shot-05.png" alt="祭典入夜！" data-i18n-attr="alt:promoVertical.shots.4.alt" /><span data-i18n-html="promoVertical.shots.4.captionHtml">05 · 12.9–14.45s<br />祭典入夜！</span></button>
        <button class="shot" data-time="15.2"><img src="storyboard/shot-06.png" alt="午夜祭典，霓虹全开。" data-i18n-attr="alt:promoVertical.shots.5.alt" /><span data-i18n-html="promoVertical.shots.5.captionHtml">06 · 14.45–17.75s<br />午夜祭典，霓虹全开。</span></button>
        <button class="shot" data-time="18.8"><img src="storyboard/shot-07.png" alt="战况再乱，视野照样清。" data-i18n-attr="alt:promoVertical.shots.6.alt" /><span data-i18n-html="promoVertical.shots.6.captionHtml">07 · 17.75–22.45s<br />战况再乱，视野照样清。</span></button>
        <button class="shot" data-time="23.7"><img src="storyboard/shot-08.png" alt="缩成窄窗，照样能潜行。" data-i18n-attr="alt:promoVertical.shots.7.alt" /><span data-i18n-html="promoVertical.shots.7.captionHtml">08 · 22.45–25.48s<br />缩成窄窗，照样能潜行。</span></button>
        <button class="shot" data-time="27"><img src="storyboard/shot-09.png" alt="墨街 · 昼夜终局结算" data-i18n-attr="alt:promoVertical.shots.8.alt" /><span data-i18n-html="promoVertical.shots.8.captionHtml">09 · 25.48–30s<br />墨街 · 昼夜终局结算</span></button>
      </div>
    </main>
    <script src="../i18n.js" defer></script>
    <script>
      const v = document.querySelector('video')
      const shots = [...document.querySelectorAll('[data-time]')]
      shots.forEach((b) => {
        b.onclick = () => {
          shots.forEach((x) => x.classList.remove('is-active'))
          b.classList.add('is-active')
          v.currentTime = +b.dataset.time
          v.pause()
          v.scrollIntoView({ behavior: 'smooth', block: 'center' })
        }
      })
    </script>
  </body>
</html>
