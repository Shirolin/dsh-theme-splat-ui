<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.1" fill="#121212"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <mask id="blob">
      <g fill="#ffffff" filter="url(#soft)">
        <ellipse cx="150" cy="160" rx="118" ry="104"/>
        <ellipse cx="292" cy="248" rx="112" ry="136"/>
        <ellipse cx="176" cy="338" rx="104" ry="78"/>
        <ellipse cx="320" cy="372" rx="72" ry="54"/>
      </g>
    </mask>
  </defs>
  <rect width="480" height="480" fill="url(#dots)" mask="url(#blob)"/>
</svg>
