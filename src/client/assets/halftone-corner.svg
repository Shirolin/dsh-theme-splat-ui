<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420">
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.6" fill="#121212"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0.2" stop-color="#fff"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fadeMask"><rect width="420" height="420" fill="url(#fade)"/></mask>
  </defs>
  <rect width="420" height="420" fill="url(#dots)" mask="url(#fadeMask)"/>
</svg>
